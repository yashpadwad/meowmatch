name: meowmatch  # ✅ Changed from "tindercloneapp" to "meowmatch"
description: "A Flutter app for ethical pet interaction, feline matchmaking, and premium pet care."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  card_swiper: ^3.0.1
  google_maps_flutter: ^2.10.0
  flutter_stripe: ^11.4.0
  http: ^1.3.0
  rive: ^0.13.20
  google_fonts: ^6.2.1
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cat1.jpg
    - assets/cat2.jpg
    - assets/cat3.jpg
    - assets/cat4.jpg
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/Poppins-Bold.ttf
    - assets/fonts/Montserrat-Bold.ttf
    - assets/fonts/Montserrat-Regular.ttf

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
