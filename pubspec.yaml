name: meowmatch
description: "A Flutter app for ethical pet interaction, feline matchmaking, and premium pet care."
publish_to: 'none' # Prevent publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ✅ Firebase packages
  firebase_core: ^2.32.0         # Required to initialize Firebase
  firebase_auth: ^4.16.0         # For user authentication
  cloud_firestore: ^4.17.5       # For storing cat/user profiles and chats
  firebase_storage: ^11.5.6      # For image upload and profile photo storage

  # ✅ Core UI and utility packages
  cupertino_icons: ^1.0.8
  card_swiper: ^3.0.1
  google_maps_flutter: ^2.12.1
  flutter_stripe: ^11.4.0
  http: ^1.3.0
  rive: ^0.13.20
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cat1.jpg
    - assets/cat2.jpg
    - assets/cat3.jpg
    - assets/cat4.jpg
    - assets/placeholder.jpg
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/Poppins-Bold.ttf
    - assets/fonts/Montserrat-Bold.ttf
    - assets/fonts/Montserrat-Regular.ttf
    - assets/default_avatar.png # ✅ Added default avatar for profile

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
